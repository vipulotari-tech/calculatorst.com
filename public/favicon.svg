<svg xmlns="http://www.w3.org/2000/svg" width="32" height="32" viewBox="0 0 32 32" role="img" aria-label="Calculator Street">
  <rect width="32" height="32" rx="8" fill="#0a0a0a"/>
  <rect width="32" height="32" rx="8" fill="none" stroke="white" stroke-opacity="0.08"/>
  <!-- Calculator body — 3D perspective -->
  <g transform="translate(6 6) rotate(-6 16 12)" style="transform-origin:16px 12px">
    <rect x="0" y="0" width="20" height="20" rx="3" fill="white" stroke="#e5e7eb"/>
    <rect x="0" y="0" width="20" height="20" rx="3" fill="none" stroke="black" stroke-opacity="0.06"/>
    <!-- Display -->
    <rect x="2.5" y="2.5" width="15" height="4.5" rx="1" fill="#dbeafe" stroke="#93c5fd" stroke-width="0.4"/>
    <rect x="3" y="3" width="14" height="3.5" rx="0.6" fill="#bfdbfe" opacity="0.7"/>
    <!-- Buttons -->
    <g fill="#1f2937">
      <rect x="2.5" y="8.5" width="3.2" height="2.2" rx="0.6"/><rect x="6.7" y="8.5" width="3.2" height="2.2" rx="0.6"/><rect x="10.9" y="8.5" width="3.2" height="2.2" rx="0.6"/><rect x="14.3" y="8.5" width="1.6" height="2.2" rx="0.6" fill="#374151"/>
      <rect x="2.5" y="11.3" width="3.2" height="2.2" rx="0.6"/><rect x="6.7" y="11.3" width="3.2" height="2.2" rx="0.6"/><rect x="10.9" y="11.3" width="3.2" height="2.2" rx="0.6"/><rect x="14.3" y="11.3" width="1.6" height="2.2" rx="0.6" fill="#374151"/>
      <rect x="2.5" y="14.1" width="3.2" height="2.2" rx="0.6"/><rect x="6.7" y="14.1" width="3.2" height="2.2" rx="0.6"/><rect x="10.9" y="14.1" width="3.2" height="2.2" rx="0.6"/><rect x="14.3" y="14.1" width="1.6" height="2.2" rx="0.6" fill="#111827"/>
      <rect x="2.5" y="16.9" width="3.2" height="1.8" rx="0.6"/><rect x="6.7" y="16.9" width="3.2" height="1.8" rx="0.6"/><rect x="10.9" y="16.9" width="3.2" height="1.8" rx="0.6"/>
    </g>
    <!-- Highlight -->
    <rect x="1" y="1" width="18" height="1.2" rx="0.6" fill="white" opacity="0.7"/>
  </g>
</svg>

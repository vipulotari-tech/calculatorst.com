<svg xmlns="http://www.w3.org/2000/svg" width="800" height="200" viewBox="0 0 800 200" role="img" aria-label="Calculator Street logo">
  <defs>
    <filter id="softShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="black" flood-opacity="0.35"/>
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="black" flood-opacity="0.25"/>
    </filter>
    <linearGradient id="bgGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0a0a0a"/>
      <stop offset="100%" stop-color="#1a1a1a"/>
    </linearGradient>
    <pattern id="charcoal" width="4" height="4" patternUnits="userSpaceOnUse">
      <rect width="4" height="4" fill="#0a0a0a"/>
      <circle cx="1" cy="1" r="0.3" fill="white" opacity="0.03"/>
      <circle cx="3" cy="3" r="0.3" fill="white" opacity="0.03"/>
    </pattern>
  </defs>
  <!-- Dark textured charcoal background -->
  <rect width="800" height="200" rx="0" fill="url(#bgGrad)"/>
  <rect width="800" height="200" fill="url(#charcoal)" opacity="0.6"/>
  <!-- Soft vignette -->
  <radialGradient id="vignette" cx="50%" cy="50%" r="70%">
    <stop offset="70%" stop-color="transparent"/>
    <stop offset="100%" stop-color="black" stop-opacity="0.25"/>
  </radialGradient>
  <rect width="800" height="200" fill="url(#vignette)" opacity="0.4"/>

  <!-- Squircle icon — deep grey -->
  <g filter="url(#softShadow)">
    <rect x="56" y="44" width="112" height="112" rx="24" fill="#2e2e2e" stroke="white" stroke-opacity="0.06" stroke-width="1"/>
    <rect x="56" y="44" width="112" height="112" rx="24" fill="none" stroke="white" stroke-opacity="0.04"/>
    <!-- Calculator isometric -->
    <g transform="translate(74 60) rotate(-8 38 38)">
      <!-- Shadow under calculator -->
      <ellipse cx="38" cy="78" rx="28" ry="6" fill="black" opacity="0.25"/>
      <!-- Body -->
      <rect x="6" y="8" width="64" height="64" rx="6" fill="white" stroke="#e5e7eb" stroke-width="0.8"/>
      <rect x="6" y="8" width="64" height="64" rx="6" fill="none" stroke="black" stroke-opacity="0.04"/>
      <!-- Top highlight -->
      <rect x="10" y="12" width="56" height="2.5" rx="1.2" fill="white" opacity="0.9"/>
      <!-- Display -->
      <rect x="12" y="16" width="52" height="14" rx="2.5" fill="#dbeafe" stroke="#93c5fd" stroke-width="0.7"/>
      <rect x="14" y="18" width="48" height="10" rx="1.5" fill="#bfdbfe" opacity="0.85"/>
      <rect x="15" y="19" width="46" height="1" rx="0.5" fill="white" opacity="0.6"/>
      <!-- Buttons -->
      <g fill="#1f2937">
        <rect x="12" y="35" width="10" height="7" rx="1.6"/><rect x="24.5" y="35" width="10" height="7" rx="1.6"/><rect x="37" y="35" width="10" height="7" rx="1.6"/><rect x="49.5" y="35" width="7" height="7" rx="1.6" fill="#374151"/>
        <rect x="12" y="44" width="10" height="7" rx="1.6"/><rect x="24.5" y="44" width="10" height="7" rx="1.6"/><rect x="37" y="44" width="10" height="7" rx="1.6"/><rect x="49.5" y="44" width="7" height="7" rx="1.6" fill="#374151"/>
        <rect x="12" y="53" width="10" height="7" rx="1.6"/><rect x="24.5" y="53" width="10" height="7" rx="1.6"/><rect x="37" y="53" width="10" height="7" rx="1.6"/><rect x="49.5" y="53" width="7" height="7" rx="1.6" fill="#111827"/>
        <rect x="12" y="62" width="10" height="6" rx="1.6"/><rect x="24.5" y="62" width="10" height="6" rx="1.6"/><rect x="37" y="62" width="10" height="6" rx="1.6"/>
      </g>
    </g>
  </g>

  <!-- Text: Calculator Street -->
  <g font-family="Inter, system-ui, -apple-system, sans-serif">
    <text x="192" y="102" font-size="42" font-weight="700" fill="white" letter-spacing="-1.2">Calculator Street</text>
    <text x="192" y="126" font-size="11" font-weight="500" fill="white" opacity="0.55" letter-spacing="3.5">CALCULATORST.COM • US-FOCUSED</text>
  </g>

  <!-- Subtle bottom line -->
  <rect x="192" y="138" width="48" height="2" rx="1" fill="white" opacity="0.12"/>
</svg>

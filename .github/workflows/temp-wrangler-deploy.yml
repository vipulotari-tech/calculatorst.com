name: Temporary Wrangler Deploy

on:
  push:
    branches:
      - feat/concrete-waste-final-differentiators

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 22

      - name: npm install
        run: npm install

      - name: npm run build
        run: npm run build

      - name: npx wrangler deploy
        run: npx wrangler deploy

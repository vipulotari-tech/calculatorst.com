name: Validate and deploy calculatorst.com

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  validate:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Check scheduled diagram audit script syntax
        run: |
          node --check scripts/audit-diagrams.mjs
          node --check scripts/diagram-repair-queue.mjs

      - name: Run tests
        run: npm test

      - name: Check types
        run: npx astro check

      - name: Build
        run: npm run build

      - name: Validate generated SEO and crawl paths
        run: npm run test:seo

      - name: Audit rendered SEO content
        run: npm run audit:seo-content

      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium

      - name: Run browser interaction tests
        run: npm run test:e2e

      - name: Upload production dist artifact
        uses: actions/upload-artifact@v4
        with:
          name: calculatorst-dist
          path: dist
          if-no-files-found: error
          retention-days: 1

  deploy-production:
    name: Deploy production Worker
    needs: validate
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Verify Cloudflare credentials are configured
        env:
          CF_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CF_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          if [ -z "$CF_API_TOKEN" ] || [ -z "$CF_ACCOUNT_ID" ]; then
            echo "::error::Set CLOUDFLARE_API_TOKEN and CLOUDFLARE_ACCOUNT_ID in repository Actions secrets before production deployment."
            exit 1
          fi

      - name: Deploy to Cloudflare Workers
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: deploy --config wrangler.jsonc

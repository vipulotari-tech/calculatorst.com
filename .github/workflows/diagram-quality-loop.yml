name: Calculator Diagram Quality Loop

on:
  # One page per run. GitHub cron execution may be delayed.
  schedule:
    - cron: '7,37 * * * *'
  workflow_dispatch:
  # Bootstrap the first page check as soon as this workflow lands on main.
  push:
    branches: [main]
    paths:
      - '.github/workflows/diagram-quality-loop.yml'

permissions:
  contents: read
  issues: write

concurrency:
  group: calculator-diagram-sequential-repair
  cancel-in-progress: false

jobs:
  repair-queue:
    runs-on: ubuntu-latest
    timeout-minutes: 28
    steps:
      - name: Checkout latest main
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Check scheduler scripts
        run: |
          node --check scripts/audit-diagrams.mjs
          node --check scripts/diagram-repair-queue.mjs

      - name: Verify calculator math and conversions
        id: math
        run: npm test
        continue-on-error: true

      - name: Verify Astro and TypeScript
        id: types
        run: npx astro check
        continue-on-error: true

      - name: Build calculator pages
        id: build
        run: npm run build
        continue-on-error: true

      - name: Verify SEO and crawl paths
        id: seo
        if: steps.build.outcome == 'success'
        run: npm run test:seo
        continue-on-error: true

      - name: Lock exactly ONE page for this run
        id: queue
        if: steps.build.outcome == 'success'
        run: node scripts/diagram-repair-queue.mjs select
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Install Chromium
        if: steps.queue.outcome == 'success'
        run: npx playwright install --with-deps chromium

      - name: Run existing Playwright regression suite
        id: browser
        if: steps.queue.outcome == 'success'
        run: npm run test:e2e
        continue-on-error: true

      - name: Audit ONE selected page and capture screenshots
        id: diagrams
        if: steps.queue.outcome == 'success'
        run: node scripts/audit-diagrams.mjs --page "$CALCULATOR_PAGE"
        continue-on-error: true
        env:
          CALCULATOR_PAGE: ${{ steps.queue.outputs.page }}

      - name: Upload selected page report and screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: sequential-diagram-audit
          path: diagram-audit/
          if-no-files-found: warn
          retention-days: 14

      - name: Complete page or hold and delegate repair
        if: always() && steps.queue.outcome == 'success'
        run: node scripts/diagram-repair-queue.mjs complete
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          COPILOT_AGENT_PAT: ${{ secrets.COPILOT_AGENT_PAT }}
          GATE_UNIT: ${{ steps.math.outcome }}
          GATE_TYPES: ${{ steps.types.outcome }}
          GATE_BUILD: ${{ steps.build.outcome }}
          GATE_SEO: ${{ steps.seo.outcome }}
          GATE_BROWSER: ${{ steps.browser.outcome }}
          GATE_DIAGRAM: ${{ steps.diagrams.outcome }}

      - name: Report verification gate failures
        if: always()
        env:
          GATE_UNIT: ${{ steps.math.outcome }}
          GATE_TYPES: ${{ steps.types.outcome }}
          GATE_BUILD: ${{ steps.build.outcome }}
          GATE_SEO: ${{ steps.seo.outcome }}
          GATE_BROWSER: ${{ steps.browser.outcome }}
          GATE_DIAGRAM: ${{ steps.diagrams.outcome }}
          GATE_QUEUE: ${{ steps.queue.outcome }}
        run: |
          for gate in "$GATE_UNIT" "$GATE_TYPES" "$GATE_BUILD" "$GATE_SEO" "$GATE_BROWSER" "$GATE_DIAGRAM" "$GATE_QUEUE"; do
            if [ "$gate" != "success" ]; then
              echo "::error::Verification failed or skipped ($gate). Page cursor is not advanced."
              exit 1
            fi
          done
          echo "All verification gates passed; see queue issue for diagram findings."
